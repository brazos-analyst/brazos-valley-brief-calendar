# Secret scan — SEC-POL-001 § 11 (Section H.3), the server-side half.
#
# WHY THIS REPO, AND WHY IT WAS MISSED. It was invisible to every previous
# coverage count. Anchorwright/sop/DEV-SOP-002-repository-layout-convention.md
# §5 tracked secret-scan coverage with a denominator of "19 repositories with a
# remote" — a figure built by walking local checkouts under ~/Claude. This
# repository has no local checkout, so no census taken that way could ever see
# it. Measured server-side with `gh repo list` per owner on 2026-08-18, the two
# owners hold 27 non-archived repositories and SEVEN were unscanned. This is one
# of the seven.
#
# A fleet census taken from local checkouts can only find repositories someone
# happened to clone. That is the durable lesson; this file is the remedy.
#
# The local pre-commit guard (~/.config/git/hooks/pre-commit, installed globally
# via core.hooksPath) does NOT protect this repository the way it protects the
# others — that hook covers commits made on this machine, and this repo has no
# working copy here. 00LessonsLearned/GAPS.md records GitHub secret scanning /
# push protection on a private repo as wontfix (it needs paid Secret
# Protection). So for this repository the CI scan is not a backstop behind a
# local guard; it is closer to the primary control.
#
# Runs the gitleaks binary directly rather than the marketplace action, which
# requires a paid licence key for organization-owned repositories.
#
# Verified 2026-08-18 BEFORE this workflow was committed: the repository was
# cloned and its full history AND working tree scanned locally at gitleaks
# 8.30.1 — no findings, exit 0 on both. CI was deliberately not allowed to be
# the first thing to discover a leak, which matters most where a failing run is
# publicly visible.
#
# NO COMMIT COUNT IS RECORDED HERE, DELIBERATELY. Any count written into a
# comment is falsified by the very commit that writes it. The "Scan full
# history" step asserts AT RUN TIME that gitleaks reported a non-zero
# commits-scanned figure and fails the build otherwise. That is a live check;
# a number in a comment is a decayed one.
name: secret-scan

on:
  push:
  # No pull_request: it re-scans the identical SHA a second time. Deliberately no
  # paths-ignore and no branches filter either — a credential can land in any file
  # type on any branch, so every push is scanned in full.
  schedule:
    - cron: '0 13 1 * *'   # monthly, so a dormant repo is still checked
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — H.3 scans the log, not just the tree

      # Pinned AND checksum-verified. Pinning alone still executes whatever bytes
      # that URL serves; the checksum is what makes the pin mean something. Bump
      # the version and the checksum together, never one alone. The checksum was
      # verified against upstream's own gitleaks_8.30.1_checksums.txt, not copied
      # from a sibling repo on trust.
      #
      # NO PER-REPO FLEET ENUMERATION HERE. Coverage lives in ONE place:
      # Anchorwright/sop/DEV-SOP-002 §5. Five workflow files once restated it and
      # none stayed in step; three "fixed" by restating a smaller split went stale
      # within a week. A pointer that carries a count is still a restatement.
      - name: Install gitleaks (pinned + verified)
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact: a finding is reported by file, line, and rule — never by value.
      # -v is required, not cosmetic: without it gitleaks reports only
      # "leaks found: N", and a guard that cannot say WHICH file is a guard you
      # have to go hunting behind.
      #
      # The commits-scanned assertion is not optional: without it an empty or
      # shallow checkout makes gitleaks exit 0 and print "0 commits scanned",
      # and a scan that covered NOTHING is indistinguishable from one that
      # covered EVERYTHING. Both render as a green check.
      - name: Scan full history
        run: |
          set -uo pipefail
          out=$(gitleaks git . --redact --no-banner -v --exit-code 1 2>&1) || code=$?
          code=${code:-0}
          printf '%s\n' "$out"

          n=$(printf '%s' "$out" | sed 's/\x1b\[[0-9;]*m//g' \
              | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | head -1) || true
          # || true is load-bearing: GitHub runs this step under `bash -e`, so a
          # failed parse would abort here with grep's exit 1 -- and exit 1 in this
          # script means "a credential was found". A format change would then be
          # reported as a leak. Two different states must not share one value.
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::gitleaks reported ${n:-no} commits scanned. This is NOT a clean result — the scan covered nothing."
            exit 2
          fi
          echo "scanned $n commits"

          if [ "$code" -ne 0 ]; then
            echo "::error::gitleaks found a credential. Values are redacted above by design. Remove it from history, ROTATE it (assume compromised, SEC-POL-001 § 16), and route a secret a feature needs behind a backend proxy."
            exit 1
          fi
          echo "no findings"
